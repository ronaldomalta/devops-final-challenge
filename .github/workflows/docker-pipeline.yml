name: Docker CI/CD Pipeline Security

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  # =======================================================
  # 1. SAST - Análise Estática no Código
  # =======================================================
  sast:
    name: SAST (Code & Secrets Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Verifica se há credenciais/secrets expostos acidentalmente no código
      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # Análise estática no código-fonte
      - name: SAST Code Scan (Trivy Repo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # =======================================================
  # 2. DOCKER BUILD - Construção e Push
  # =======================================================
  docker:
    name: Docker Build & Push
    needs: sast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Análise de segurança na imagem Docker da API
      - name: Build local para teste de segurança
        run: |
          docker build -t devops-final-api:local .

      - name: Scan de Vulnerabilidades na Imagem (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-final-api:local'
          format: 'table'
          severity: 'HIGH,CRITICAL'

      - name: Build e Push da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-final-api:latest

  # =======================================================
  # 3. DAST - Análise Dinâmica na API em Execução
  # =======================================================
  dast:
    name: DAST (OWASP ZAP Scan)
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Sobe todo a infraestrutura (Postgres, Redis, API) para a API responder corretamente
      - name: Subir ambiente com Docker Compose
        run: |
          docker compose up -d --build
          
          # Aguarda 20 segundos para o Postgres e a API inicializarem e ficarem healthy
          sleep 20

      # Validação se a API responde na porta 3001
      - name: Check Health da API
        run: |
          curl -I http://localhost:3001 || exit 1

      # Dispara a análise DAST focada na API (porta 3001)
      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:3001'
          artifact_name: 'zap-scan-report'  
          fail_action: false
          allow_issue_writing: false

      - name: Derrubar ambiente de teste
        if: always()
        run: |
          docker compose down -v